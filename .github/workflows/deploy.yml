# Builds the Astro site and uploads it over FTPS into public_html/site on Hostinger.
# Runs on every push to main, when WordPress content is published (repository_dispatch from the
# HashSlash Headless plugin), on demand, and once a day as a safety net.
name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wordpress-publish]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          WP_URL: https://cms.hash-slash.com

      - name: Check the build output
        run: test -s dist/index.html && test -s dist/thank-you/index.html

      # The FTP account is locked by Hostinger to public_html/site, so this step
      # can never reach the WordPress files in public_html.
      - name: Upload to Hostinger (public_html/site)
        env:
          FTP_SERVER: 145.79.209.134
          FTP_USER: u377581953.sitedeploy
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then echo "::error::Add the FTP_PASSWORD repository secret first."; exit 1; fi
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp > /dev/null
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no;
            set net:max-retries 3; set net:timeout 30;
            mirror --reverse --delete --parallel=4 --verbose=1 dist/ ./;
            bye"
